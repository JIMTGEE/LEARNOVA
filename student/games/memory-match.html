<html lang="en">

    <style>
        :root {
            --primary: #FF4500;
            --secondary: #1a202c;
            --text: #e2e8f0;
            --glass-bg: rgba(255,255,255,0.1);
            --glass-border: rgba(255,255,255,0.2);
        }
        body {
            background: linear-gradient(135deg, var(--secondary), #2d3748);
            color: var(--text);
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 2rem;
            max-width: 800px;
            width: 90%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 1rem;
            animation: fadeIn 1s ease-in;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }
        .btn {
            background: var(--primary);
            color: #fff;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s, background 0.3s;
            font-weight: bold;
        }
        .btn:hover {
            transform: scale(1.05);
            background: #FF6B00;
        }
        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 100px);
            grid-template-rows: repeat(4, 150px);
            gap: 1rem;
            justify-content: center;
            margin: 2rem auto;
        }
        .grid-6 {
            display: grid;
            grid-template-columns: repeat(6, 90px);
            grid-template-rows: repeat(6, 135px);
            gap: 0.75rem;
            justify-content: center;
            margin: 2rem auto;
        }
        .grid-8 {
            display: grid;
            grid-template-columns: repeat(8, 80px);
            grid-template-rows: repeat(8, 120px);
            gap: 0.5rem;
            justify-content: center;
            margin: 2rem auto;
        }
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: pointer;
            perspective: 1000px;
            transition: transform 0.5s;
        }
        .card-inner {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.5s;
        }
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-front {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
        }
        .card-back {
            background: #FF4500;
            color: #fff;
            transform: rotateY(180deg);
        }
        .card.matched .card-back {
            background: green;
            transform: scale(1.1) rotateY(180deg);
            animation: bounce 0.5s;
        }
        .card-content {
            text-align: center;
            padding: 0.5rem;
            font-size: 0.9rem;
            word-wrap: break-word;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes bounce {
            0%, 100% { transform: scale(1.1) rotateY(180deg); }
            50% { transform: scale(1.15) rotateY(180deg); }
        }
        .hidden {
            display: none;
        }
        .theme-science .card-back {
            background: #4CAF50;
        }
        .theme-english .card-back {
            background: #2196F3;
        }
        .theme-history .card-back {
            background: #FFC107;
        }
        .theme-wellbeing .card-back {
            background: #9C27B0;
        }
        .theme-science .card.matched .card-back {
            background: darkgreen;
        }
        .theme-english .card.matched .card-back {
            background: navy;
        }
        .theme-history .card.matched .card-back {
            background: goldenrod;
        }
        .theme-wellbeing .card.matched .card-back {
            background: purple;
        }
        @media (max-width: 768px) {
            .grid-4 {
                grid-template-columns: repeat(4, 80px);
                grid-template-rows: repeat(4, 120px);
            }
            .grid-6 {
                grid-template-columns: repeat(6, 70px);
                grid-template-rows: repeat(6, 105px);
            }
            .grid-8 {
                grid-template-columns: repeat(8, 60px);
                grid-template-rows: repeat(8, 90px);
            }
            .card-content {
                font-size: 0.8rem;
            }
        }
        @media (max-width: 480px) {
            .grid-4 {
                grid-template-columns: repeat(4, 60px);
                grid-template-rows: repeat(4, 90px);
            }
            .grid-6 {
                grid-template-columns: repeat(6, 50px);
                grid-template-rows: repeat(6, 75px);
            }
            .grid-8 {
                grid-template-columns: repeat(8, 45px);
                grid-template-rows: repeat(8, 67.5px);
            }
            .card-content {
                font-size: 0.7rem;
            }
            h1 {
                font-size: 2rem;
            }
        }
        .progress-bar {
            height: 20px;
            background: gray;
            border-radius: 10px;
            margin: 1rem 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            transition: width 0.5s;
        }
        .streak {
            color: gold;
            font-weight: bold;
        }
        .timer {
            font-size: 1.5rem;
            color: red;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }
        .container h1 {
            text-shadow: 0 0 10px var(--primary);
        }
        .container p {
            text-shadow: 0 0 5px #fff;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .card:hover .card-front {
            box-shadow: 0 0 15px var(--primary);
        }
        .theme-science .card:hover .card-front {
            box-shadow: 0 0 15px #4CAF50;
        }
        .theme-english .card:hover .card-front {
            box-shadow: 0 0 15px #2196F3;
        }
        .theme-history .card:hover .card-front {
            box-shadow: 0 0 15px #FFC107;
        }
        .theme-wellbeing .card:hover .card-front {
            box-shadow: 0 0 15px #9C27B0;
        }
        body.dark {
            --secondary: #0d1117;
            --text: #c9d1d9;
            --glass-bg: rgba(45,55,72,0.1);
        }
        .toggle-dark {
            position: absolute;
            top: 1rem;
            right: 1rem;
            cursor: pointer;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fadeInUp { animation: fadeInUp 0.5s; }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fadeInDown { animation: fadeInDown 0.5s; }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spin { animation: spin 1s linear infinite; }
        .hover\:scale-105:hover { transform: scale(1.05); }
        .hover\:bg-orange-600:hover { background: #ea580c; }
        .hover\:text-white:hover { color: #fff; }
        .focus\:ring { outline: none; ring: 2px solid var(--primary); }
        .disabled { opacity: 0.5; cursor: not-allowed; }
        .placeholder\:text-gray-400::placeholder { color: #9ca3af; }
        @media (min-width: 640px) {
            .sm\:p-6 { padding: 1.5rem; }
            .sm\:text-3xl { font-size: 1.875rem; }
        }
        @media (min-width: 768px) {
            .md\:p-8 { padding: 2rem; }
            .md\:text-4xl { font-size: 2.25rem; }
        }
        @media (min-width: 1024px) {
            .lg\:p-10 { padding: 2.5rem; }
            .lg\:text-5xl { font-size: 3rem; }
        }

            .xl\:p-12 { padding: 3rem; }

        .dark .bg-secondary { background: #0d1117; }
        .dark .text-text { color: #c9d1d9; }
        .dark .glass-bg { background: rgba(45,55,72,0.1); }
    </style>
</head>
<body>
    <div class="toggle-dark btn p-2 rounded-full absolute top-4 right-4" onclick="toggleDarkMode()">🌙</div>
    <div id="main-menu" class="container">
        <h1 class="fadeIn">Memory Match Mastery</h1>
        <p>Select a theme and difficulty to start! Inspired by Ghanaian learning traditions.</p>

                <option value="history">Ghanaian History</option>
                <option value="wellbeing">Wellbeing Concepts</option>

            <button onclick="startGame('easy')" class="btn">Easy (4x4)</button>
            <button onclick="startGame('medium')" class="btn">Medium (6x6)</button>
            <button onclick="startGame('hard')" class="btn">Hard (8x8)</button>
            <button onclick="showHighScores()" class="btn bg-gray-700">High Scores</button>
        </div>
    </div>
    <div id="game" class="hidden container">
        <h1>Memory Match</h1>
        <p>Theme: <span id="current-theme"></span> | Difficulty: <span id="current-difficulty"></span></p>
        <p>Score: <span id="score">0</span> | Matches: <span id="matches">0</span> | Streak: <span id="streak" class="streak">0</span></p>
        <div class="progress-bar"><div id="progress-fill" class="progress-fill" style="width: 0%;"></div></div>
        <p>Time Left: <span id="timer" class="timer">60</span>s</p>
        <div id="grid" class="grid"></div>
        <div id="feedback" class="text-lg my-4"></div>
        <button onclick="backToMenu()" class="btn bg-gray-700">Back to Menu</button>
    </div>
    <div id="high-scores" class="hidden container">
        <h1>High Scores</h1>
        <div id="scores-list" class="flex flex-col gap-2"></div>
        <button onclick="backToMenu()" class="btn bg-gray-700">Back to Menu</button>
    </div>

        function startGame(diff) {
            currentDifficulty = diff;
            currentTheme = document.getElementById('theme-select').value;
            matches = 0; score = 0; streak = 0;
            timeLeft = diff === 'easy' ? 120 : diff === 'medium' ? 90 : 60;
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game').classList.remove('hidden');
            document.getElementById('current-theme').textContent = currentTheme.charAt(0).toUpperCase() + currentTheme.slice(1);
            document.getElementById('current-difficulty').textContent = diff.charAt(0).toUpperCase() + diff.slice(1);
            document.getElementById('score').textContent = score;
            document.getElementById('matches').textContent = matches;
            document.getElementById('streak').textContent = streak;
            document.getElementById('timer').textContent = timeLeft;
            setupGrid();
            startTimer();
        }

        function setupGrid() {
            const grid = document.getElementById('grid');
            grid.className = 'grid-' + (currentDifficulty === 'easy' ? '4' : currentDifficulty === 'medium' ? '6' : '8') + ' theme-' + currentTheme;
            grid.innerHTML = '';
            const pairCount = currentDifficulty === 'easy' ? 8 : currentDifficulty === 'medium' ? 18 : 32;
            totalPairs = pairCount;
            const allPairs = themes[currentTheme];
            const selectedPairs = allPairs.sort(() => 0.5 - Math.random()).slice(0, pairCount);
            const cards = [...selectedPairs.flatMap(p => [
                { value: p.term, type: 'term', pair: p.def },
                { value: p.def, type: 'def', pair: p.term }
            ])].sort(() => 0.5 - Math.random());
            cards.forEach((card, i) => {
                const div = document.createElement('div');
                div.className = 'card';
                div.dataset.index = i;
                div.dataset.value = card.value;
                div.dataset.type = card.type;
                div.dataset.pair = card.pair;
                div.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front"></div>
                        <div class="card-back">
                            <div class="card-content">${card.value}</div>
                        </div>
                    </div>
                `;
                div.addEventListener('click', () => flipCard(div));
                grid.appendChild(div);
            });
            updateProgress();
        }

        function flipCard(card) {
            if (selected.length < 2 && !card.classList.contains('flipped') && !card.classList.contains('matched')) {
                card.classList.add('flipped');
                selected.push(card);
                playSound('flip');
                if (selected.length === 2) checkMatch();
            }
        }

        function checkMatch() {
            const [c1, c2] = selected;
            const isMatch = c1.dataset.value === c2.dataset.pair && c2.dataset.value === c1.dataset.pair;
            if (isMatch) {
                c1.classList.add('matched');
                c2.classList.add('matched');
                matches++;
                score += 10 + streak * 5;
                streak++;
                document.getElementById('feedback').textContent = 'Match! ' + (c1.dataset.type === 'term' ? c1.dataset.value + ': ' + c1.dataset.pair : c2.dataset.value + ': ' + c2.dataset.pair);
                document.getElementById('feedback').className = 'text-green-500 bounce';
                confetti.addConfetti({ emojis: ['🧠', '📚', '🌟'], confettiNumber: 100 });
                playSound('match');
                showEducationalFact(document.getElementById('feedback').textContent);
                if (matches === totalPairs) {
                    clearInterval(timerInterval);
                    unlockAchievement('Perfect Match');
                    alert('You won! Final Score: ' + score);
                    saveHighScore();
                    backToMenu();
                }
            } else {
                streak = 0;
                document.getElementById('feedback').textContent = 'No match. Try again!';
                document.getElementById('feedback').className = 'text-red-500';
                playSound('mismatch');
                setTimeout(() => {
                    c1.classList.remove('flipped');
                    c2.classList.remove('flipped');
                    clearFeedback();
                }, 1500);
            }
            document.getElementById('matches').textContent = matches;
            document.getElementById('score').textContent = score;
            document.getElementById('streak').textContent = streak;
            updateProgress();
            updateScoreDisplay();
            updateMatchesDisplay();
            updateStreakDisplay();
            selected = [];
        }

        function updateProgress() {
            const progress = (matches / totalPairs) * 100;
            document.getElementById('progress-fill').style.width = progress + '%';
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = timeLeft;
                updateTimerDisplay();
                if (timeLeft <= 10) {
                    document.getElementById('timer').classList.add('text-red-500');
                }
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert('Time\'s up! Score: ' + score);
                    saveHighScore();
                    backToMenu();
                }
            }, 1000);
        }

        function saveHighScore() {
            const scores = JSON.parse(localStorage.getItem('memoryMatchScores') || '[]');
            scores.push({ score, theme: currentTheme, difficulty: currentDifficulty, date: new Date().toLocaleString() });
            scores.sort((a, b) => b.score - a.score);
            localStorage.setItem('memoryMatchScores', JSON.stringify(scores.slice(0, 10)));
        }

        function showHighScores() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('high-scores').classList.remove('hidden');
            const scores = JSON.parse(localStorage.getItem('memoryMatchScores') || '[]');
            const list = document.getElementById('scores-list');
            list.innerHTML = '';
            scores.forEach(s => {
                const p = document.createElement('p');
                p.className = 'text-lg';
                p.textContent = `${s.score} - ${s.theme.charAt(0).toUpperCase() + s.theme.slice(1)} (${s.difficulty}) - ${s.date}`;
                list.appendChild(p);
            });
            if (!scores.length) {
                list.innerHTML = '<p class="text-lg">No scores yet! Play a game to set one.</p>';
            }
        }

        function backToMenu() {
            clearInterval(timerInterval);
            document.getElementById('game').classList.add('hidden');
            document.getElementById('high-scores').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
            document.getElementById('feedback').textContent = '';
            resetGame();
        }
